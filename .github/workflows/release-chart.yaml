name: release-chart

on:
  push:
    tags:
      - "roaminal-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-helm
        uses: azure/setup-helm@v4

      - name: setup-forgekit
        id: forgekit
        run: |
          FORGEKIT_BIN="$(bash "$GITHUB_WORKSPACE/setup/forgekit.sh")"
          echo "bin=${FORGEKIT_BIN}" >> "$GITHUB_OUTPUT"
          "${FORGEKIT_BIN}" --version

      - name: validate-tag
        env:
          FORGEKIT_BIN: ${{ steps.forgekit.outputs.bin }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test "${TAG_NAME#roaminal-v}" = "$(${FORGEKIT_BIN} --project-root "$GITHUB_WORKSPACE" --output json version get roaminal | node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => process.stdout.write(JSON.parse(s).data.app.value))')"
          helm lint "$GITHUB_WORKSPACE/chart" --strict

      - name: publish-chart
        env:
          FORGEKIT_BIN: ${{ steps.forgekit.outputs.bin }}
          CHART_REGISTRY: ghcr.io/${{ github.repository }}-charts
          CHART_REGISTRY_USERNAME: ${{ github.actor }}
          CHART_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$FORGEKIT_BIN" publish chart build \
            --project-root "$GITHUB_WORKSPACE" \
            --chart-dir "$GITHUB_WORKSPACE/chart" \
            --semver \
            --multi-tag
