include:
  - "**/*.go"
  - "**/*.ts"
  - "**/*.tsx"
  - "**/*.mjs"
  - "**/*.sh"

exclude:
  - "build/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"

max_lines_by_ext:
  .go: 250
  .ts: 300
  .tsx: 300
  .mjs: 300
  .sh: 200

commands:
  - name: "Shell syntax"
    cmd: "bash"
    args:
      - "-n"
      - "setup/forgekit.sh"
      - ".github/scripts/release-plan.sh"

  - name: "Release planner Python syntax"
    cmd: "python3"
    args:
      - "-c"
      - "import ast; from pathlib import Path; ast.parse(Path('.github/scripts/release-plan.py').read_text())"

  - name: "Go formatting"
    cmd: "sh"
    args:
      - "-c"
      - "test -z \"$(find backend agents/hooks/codex -type f -name '*.go' -print0 | xargs -0 gofmt -l)\""

  - name: "Codex hook unit tests"
    cmd: "go"
    args: ["-C", "agents/hooks/codex", "test", "./..."]

  - name: "Codex hook vet"
    cmd: "go"
    args: ["-C", "agents/hooks/codex", "vet", "./..."]

  - name: "Codex hook bundle"
    cmd: "sh"
    args:
      - "-c"
      - >-
        set -eu;
        cd agents/hooks/codex;
        bundle_tmp=$(mktemp -d);
        trap 'rm -rf "$bundle_tmp"' EXIT;
        cp component.json "$bundle_tmp/component.json";
        mkdir -p "$bundle_tmp/config";
        cp config/hooks.json "$bundle_tmp/config/hooks.json";
        for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
        target_os=${target%-*}; target_arch=${target#*-};
        mkdir -p "$bundle_tmp/$target";
        CGO_ENABLED=0 GOOS="$target_os" GOARCH="$target_arch"
        go build -trimpath -ldflags="-s -w -X github.com/ben-wangz/roaminal/agents/hooks/codex/internal/buildinfo.Version=1"
        -o "$bundle_tmp/$target/roaminal-agent-hook" ./cmd/roaminal-agent-hook;
        done;
        go run ./cmd/bundle-manifest -root "$bundle_tmp"
        -output "$bundle_tmp/manifest.json";
        test -s "$bundle_tmp/manifest.json"

  - name: "Backend unit tests"
    cmd: "go"
    args: ["-C", "backend", "test", "./..."]

  - name: "Backend race tests"
    cmd: "go"
    args: ["-C", "backend", "test", "-race", "./..."]

  - name: "Backend vet"
    cmd: "go"
    args: ["-C", "backend", "vet", "./..."]

  - name: "Worker dependencies"
    cmd: "npm"
    args: ["--prefix", "terminal-worker", "ci"]

  - name: "Worker lint"
    cmd: "npm"
    args: ["--prefix", "terminal-worker", "run", "lint"]

  - name: "Worker tests"
    cmd: "npm"
    args: ["--prefix", "terminal-worker", "test"]

  - name: "Frontend dependencies"
    cmd: "npm"
    args: ["--prefix", "frontend", "ci"]

  - name: "Frontend lint"
    cmd: "npm"
    args: ["--prefix", "frontend", "run", "lint"]

  - name: "Frontend typecheck"
    cmd: "npm"
    args: ["--prefix", "frontend", "run", "typecheck"]

  - name: "Frontend unit tests"
    cmd: "npm"
    args: ["--prefix", "frontend", "test", "--", "--run"]

  - name: "Frontend production build"
    cmd: "npm"
    args: ["--prefix", "frontend", "run", "build"]

  - name: "Helm chart lint"
    cmd: "helm"
    args: ["lint", "chart", "--strict", "--set", "app.acceptTerms=true"]

  - name: "Helm chart render"
    cmd: "sh"
    args:
      - "-c"
      - >-
        set -eu;
        helm template roaminal chart --namespace chart-ci
        --set app.acceptTerms=true >/dev/null;
        helm template roaminal chart --namespace chart-ci
        --set app.acceptTerms=true
        --set persistence.existingClaim=roaminal-data-ci
        --set ssh.source=secret --set ssh.secret.name=roaminal-ssh-ci
        --set ingress.enabled=true --set ingress.tls=true
        --set ingress.tlsSecret=roaminal-tls-ci >/dev/null;
        helm template roaminal chart --namespace chart-ci
        --set app.acceptTerms=true
        --set persistence.enabled=false --set ssh.source=volume
        --set ssh.volume.name=ssh-projected
        --set-json 'extraVolumes=[{"name":"ssh-projected","projected":{"sources":[]}}]'
        >/dev/null;
        helm template roaminal chart --namespace chart-ci
        --set app.acceptTerms=true --set app.clientDiagnosticsEnabled=false
        >/dev/null

  - name: "Helm chart validation cases"
    cmd: "sh"
    args:
      - "-c"
      - >-
        set -eu;
        helm template roaminal chart --namespace chart-ci
        --set app.acceptTerms=true
        --set app.scrollbackLines=0
        --set app.maxConnectionInstances=256
        --set app.maxClientsPerConnectionInstance=64
        --set app.authMaxAttempts=1000 >/dev/null;
        helm template roaminal chart --namespace chart-ci
        --set app.acceptTerms=true
        --set persistence.enabled=false
        --set persistence.emptyDir.medium=Memory
        --set persistence.emptyDir.sizeLimit=1Gi >/dev/null;
        if helm template roaminal chart --namespace chart-ci --set app.acceptTerms=false >/dev/null 2>&1; then exit 1; fi;
        if helm template roaminal chart --namespace chart-ci --set app.acceptTerms=true --set app.scrollbackLines=50001 >/dev/null 2>&1; then exit 1; fi;
        if helm template roaminal chart --namespace chart-ci --set app.acceptTerms=true --set ssh.source=secret >/dev/null 2>&1; then exit 1; fi;
        if helm template roaminal chart --namespace chart-ci --set app.acceptTerms=true --set persistence.enabled=false --set persistence.existingClaim=invalid >/dev/null 2>&1; then exit 1; fi

  - name: "Workflow YAML syntax"
    cmd: "ruby"
    args:
      - "-ryaml"
      - "-e"
      - "ARGV.each { |path| YAML.safe_load_file(path, aliases: true) }"
      - ".github/workflows/lint.yaml"
      - ".github/workflows/release-chart.yaml"
      - ".github/workflows/release-container.yaml"
