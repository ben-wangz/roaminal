<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img">
  <title>Sleeping Codex robot, side view</title>
  <desc>A pixel art Codex robot curled up on its side inside a charging cradle while the hook is not initialized.</desc>
  <g shape-rendering="crispEdges">
    <!-- quiet night signals -->
    <rect x="58" y="54" width="44" height="12" fill="#f2c14e"/>
    <rect x="46" y="66" width="68" height="44" fill="#f2c14e"/>
    <rect x="58" y="110" width="44" height="12" fill="#f2c14e"/>
    <rect x="78" y="66" width="48" height="44" fill="#002b36"/>
    <rect x="160" y="74" width="10" height="10" fill="#2aa198"/>
    <rect x="204" y="46" width="8" height="8" fill="#859900"/>
    <rect x="438" y="112" width="12" height="12" fill="#2aa198"/>

    <!-- charging cradle -->
    <rect x="42" y="394" width="428" height="22" fill="#001b22"/>
    <rect x="58" y="416" width="396" height="36" fill="#073642"/>
    <rect x="82" y="452" width="348" height="14" fill="#001b22"/>
    <rect x="116" y="466" width="280" height="8" fill="#001b22" opacity=".52"/>
    <rect x="72" y="404" width="368" height="12" fill="#586e75"/>
    <rect x="92" y="404" width="138" height="8" fill="#93a1a1"/>
    <rect x="326" y="404" width="92" height="8" fill="#2aa198"/>
    <rect x="352" y="426" width="56" height="12" fill="#001b22"/>
    <rect x="360" y="428" width="18" height="8" fill="#859900"/>
    <rect x="384" y="428" width="16" height="8" fill="#b8d638"/>

    <!-- pillow -->
    <rect x="50" y="300" width="174" height="98" fill="#001b22"/>
    <rect x="64" y="310" width="146" height="74" fill="#586e75"/>
    <rect x="78" y="310" width="116" height="14" fill="#93a1a1"/>
    <rect x="64" y="372" width="146" height="12" fill="#073642"/>

    <!-- head in left profile -->
    <rect x="92" y="192" width="194" height="158" fill="#001b22"/>
    <rect x="76" y="218" width="218" height="106" fill="#001b22"/>
    <rect x="104" y="202" width="168" height="140" fill="#2aa198"/>
    <rect x="88" y="228" width="192" height="88" fill="#2aa198"/>
    <rect x="118" y="210" width="140" height="12" fill="#5fd0c4"/>
    <rect x="104" y="236" width="12" height="58" fill="#5fd0c4"/>
    <rect x="112" y="236" width="130" height="72" fill="#002b36"/>
    <rect x="120" y="246" width="114" height="52" fill="#073642"/>
    <rect x="120" y="246" width="114" height="8" fill="#0a4651"/>
    <rect x="88" y="316" width="192" height="14" fill="#0b4b53"/>
    <!-- profile brow, closed eye and cheek -->
    <rect x="132" y="266" width="50" height="8" fill="#93a1a1"/>
    <rect x="142" y="274" width="34" height="6" fill="#93a1a1"/>
    <rect x="192" y="282" width="28" height="6" fill="#586e75"/>
    <rect x="218" y="272" width="16" height="24" fill="#073642"/>
    <rect x="126" y="288" width="6" height="6" fill="#2aa198"/>
    <!-- side ear -->
    <rect x="272" y="236" width="36" height="64" fill="#001b22"/>
    <rect x="272" y="246" width="28" height="44" fill="#0b4b53"/>
    <rect x="272" y="258" width="18" height="20" fill="#2aa198"/>

    <!-- antenna folded backward -->
    <rect x="224" y="152" width="12" height="44" fill="#001b22"/>
    <rect x="228" y="156" width="8" height="38" fill="#2aa198"/>
    <rect x="232" y="148" width="58" height="12" fill="#001b22"/>
    <rect x="278" y="132" width="28" height="22" fill="#001b22"/>
    <rect x="284" y="136" width="16" height="14" fill="#b58900"/>
    <rect x="288" y="136" width="8" height="6" fill="#f2c14e"/>

    <!-- curled back and body -->
    <rect x="268" y="264" width="148" height="140" fill="#001b22"/>
    <rect x="250" y="292" width="184" height="94" fill="#001b22"/>
    <rect x="282" y="276" width="120" height="116" fill="#0b4b53"/>
    <rect x="264" y="304" width="156" height="70" fill="#073642"/>
    <rect x="286" y="284" width="104" height="14" fill="#2aa198"/>
    <rect x="292" y="320" width="96" height="36" fill="#002b36"/>
    <rect x="306" y="330" width="46" height="8" fill="#586e75"/>
    <rect x="360" y="330" width="14" height="8" fill="#b58900"/>
    <rect x="400" y="302" width="20" height="60" fill="#0b4b53"/>

    <!-- arm tucked beneath face -->
    <rect x="226" y="318" width="72" height="44" fill="#001b22"/>
    <rect x="238" y="326" width="54" height="28" fill="#2aa198"/>
    <rect x="194" y="348" width="94" height="38" fill="#001b22"/>
    <rect x="208" y="356" width="66" height="22" fill="#5fd0c4"/>

    <!-- knees drawn up, feet overlapping -->
    <rect x="354" y="354" width="70" height="54" fill="#001b22"/>
    <rect x="364" y="362" width="50" height="38" fill="#586e75"/>
    <rect x="398" y="374" width="62" height="38" fill="#001b22"/>
    <rect x="408" y="382" width="42" height="22" fill="#93a1a1"/>
    <rect x="326" y="378" width="58" height="34" fill="#001b22"/>
    <rect x="336" y="384" width="38" height="20" fill="#586e75"/>

    <!-- sleep drifting upward -->
    <rect x="330" y="182" width="54" height="12" fill="#2aa198"/>
    <rect x="372" y="194" width="12" height="12" fill="#2aa198"/>
    <rect x="360" y="206" width="12" height="12" fill="#2aa198"/>
    <rect x="348" y="218" width="36" height="12" fill="#2aa198"/>
    <rect x="392" y="118" width="70" height="14" fill="#f2c14e"/>
    <rect x="448" y="132" width="14" height="14" fill="#f2c14e"/>
    <rect x="434" y="146" width="14" height="14" fill="#f2c14e"/>
    <rect x="420" y="160" width="42" height="14" fill="#f2c14e"/>
  </g>
</svg>
