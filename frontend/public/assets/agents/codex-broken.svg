<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img">
  <title>Broken Codex robot, slumped three-quarter view</title>
  <desc>A clear pixel art Codex robot slumped on the ground with a cracked face, hanging arm and detached forearm while the hook has failed.</desc>
  <g shape-rendering="crispEdges">
    <!-- ground -->
    <rect x="44" y="452" width="424" height="18" fill="#002b36" opacity=".76"/>
    <rect x="112" y="470" width="288" height="8" fill="#001b22" opacity=".52"/>

    <!-- bent antenna and restrained smoke -->
    <rect x="248" y="54" width="12" height="42" fill="#001b22"/>
    <rect x="252" y="58" width="8" height="36" fill="#dc322f"/>
    <rect x="218" y="46" width="34" height="12" fill="#001b22"/>
    <rect x="198" y="30" width="28" height="22" fill="#001b22"/>
    <rect x="204" y="34" width="16" height="14" fill="#dc322f"/>
    <rect x="286" y="66" width="16" height="26" fill="#586e75" opacity=".84"/>
    <rect x="302" y="42" width="22" height="26" fill="#586e75" opacity=".58"/>
    <rect x="324" y="20" width="28" height="24" fill="#586e75" opacity=".34"/>

    <!-- large recognizable robot head -->
    <rect x="132" y="88" width="252" height="174" fill="#001b22"/>
    <rect x="116" y="116" width="284" height="118" fill="#001b22"/>
    <rect x="144" y="98" width="228" height="156" fill="#2aa198"/>
    <rect x="128" y="126" width="256" height="100" fill="#2aa198"/>
    <rect x="158" y="106" width="200" height="12" fill="#5fd0c4"/>
    <rect x="144" y="134" width="12" height="66" fill="#5fd0c4"/>
    <rect x="164" y="130" width="184" height="92" fill="#002b36"/>
    <rect x="176" y="142" width="160" height="68" fill="#073642"/>
    <rect x="176" y="142" width="160" height="8" fill="#0a4651"/>
    <rect x="144" y="238" width="228" height="12" fill="#0b4b53"/>
    <!-- ears keep the silhouette unmistakably robotic -->
    <rect x="88" y="140" width="40" height="72" fill="#001b22"/>
    <rect x="96" y="150" width="32" height="52" fill="#0b4b53"/>
    <rect x="108" y="164" width="20" height="24" fill="#dc322f"/>
    <rect x="384" y="140" width="40" height="72" fill="#001b22"/>
    <rect x="384" y="150" width="32" height="52" fill="#0b4b53"/>
    <rect x="384" y="164" width="20" height="24" fill="#586e75"/>

    <!-- simple failed expression and one crack -->
    <rect x="194" y="166" width="12" height="12" fill="#dc322f"/>
    <rect x="206" y="178" width="12" height="12" fill="#dc322f"/>
    <rect x="218" y="166" width="12" height="12" fill="#dc322f"/>
    <rect x="282" y="172" width="34" height="8" fill="#dc322f"/>
    <rect x="292" y="180" width="18" height="12" fill="#ff6b5e"/>
    <rect x="238" y="202" width="42" height="6" fill="#93a1a1"/>
    <rect x="260" y="116" width="10" height="34" fill="#dc322f"/>
    <rect x="270" y="146" width="12" height="24" fill="#dc322f"/>

    <!-- offset neck makes the head look slumped -->
    <rect x="230" y="250" width="74" height="32" fill="#001b22"/>
    <rect x="242" y="250" width="50" height="22" fill="#586e75"/>

    <!-- complete torso -->
    <rect x="172" y="274" width="180" height="140" fill="#001b22"/>
    <rect x="156" y="302" width="212" height="84" fill="#001b22"/>
    <rect x="188" y="286" width="148" height="116" fill="#0b4b53"/>
    <rect x="202" y="286" width="120" height="14" fill="#2aa198"/>
    <rect x="206" y="318" width="112" height="56" fill="#073642"/>
    <rect x="220" y="330" width="84" height="30" fill="#002b36"/>
    <rect x="232" y="340" width="22" height="8" fill="#dc322f"/>
    <rect x="266" y="340" width="24" height="8" fill="#586e75"/>
    <rect x="258" y="360" width="10" height="24" fill="#dc322f"/>

    <!-- one attached arm hanging to the floor -->
    <rect x="112" y="292" width="60" height="44" fill="#001b22"/>
    <rect x="124" y="302" width="46" height="26" fill="#0b4b53"/>
    <rect x="92" y="326" width="50" height="92" fill="#001b22"/>
    <rect x="102" y="338" width="30" height="68" fill="#2aa198"/>
    <rect x="68" y="402" width="76" height="42" fill="#001b22"/>
    <rect x="82" y="412" width="48" height="22" fill="#dc322f"/>

    <!-- broken shoulder and two exposed wires -->
    <rect x="352" y="296" width="46" height="44" fill="#001b22"/>
    <rect x="352" y="306" width="32" height="24" fill="#0b4b53"/>
    <rect x="388" y="316" width="12" height="32" fill="#dc322f"/>
    <rect x="400" y="342" width="24" height="10" fill="#dc322f"/>
    <rect x="382" y="340" width="10" height="28" fill="#f2c14e"/>

    <!-- detached forearm lying nearby -->
    <rect x="404" y="372" width="48" height="70" fill="#001b22"/>
    <rect x="414" y="384" width="28" height="48" fill="#0b4b53"/>
    <rect x="438" y="420" width="54" height="34" fill="#001b22"/>
    <rect x="448" y="428" width="30" height="18" fill="#dc322f"/>

    <!-- two clear legs: one bent, one extended -->
    <rect x="184" y="398" width="64" height="50" fill="#001b22"/>
    <rect x="196" y="406" width="42" height="34" fill="#586e75"/>
    <rect x="140" y="432" width="108" height="30" fill="#001b22"/>
    <rect x="156" y="440" width="78" height="14" fill="#93a1a1"/>
    <rect x="286" y="398" width="60" height="52" fill="#001b22"/>
    <rect x="296" y="406" width="40" height="36" fill="#586e75"/>
    <rect x="324" y="432" width="116" height="30" fill="#001b22"/>
    <rect x="336" y="440" width="88" height="14" fill="#93a1a1"/>

    <!-- minimal failure sparks -->
    <rect x="430" y="250" width="12" height="24" fill="#dc322f"/>
    <rect x="442" y="266" width="24" height="12" fill="#dc322f"/>
    <rect x="418" y="274" width="12" height="20" fill="#f2c14e"/>
  </g>
</svg>
