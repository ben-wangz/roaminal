{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "roaminal.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "roaminal.labels" (dict "context" $ "extra" .Values.serviceAccount.labels) | nindent 4 }}
  {{- $annotations := mergeOverwrite (deepCopy .Values.commonAnnotations) .Values.serviceAccount.annotations }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
