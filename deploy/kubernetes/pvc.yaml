apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: roaminal-state
  labels:
    app.kubernetes.io/name: roaminal
    app.kubernetes.io/managed-by: roaminal-mvp-test
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: roaminal-workspace
  labels:
    app.kubernetes.io/name: roaminal
    app.kubernetes.io/managed-by: roaminal-mvp-test
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: roaminal-ssh
  labels:
    app.kubernetes.io/name: roaminal
    app.kubernetes.io/managed-by: roaminal-mvp-test
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
