apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roaminal
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
    - hosts: [roaminal.example.invalid]
      secretName: roaminal-tls
  rules:
    - host: roaminal.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: roaminal
                port:
                  name: http
